<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tetraedro</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

#sliderContainer {
  position: absolute;
  top: 0.5rem;
  left: 50%;
  transform: translateX(-50%);
  background: #777;
  height: 3rem;
  display: flex;
  align-items: center;
  justify-content: flex-start; /* pulsante e slider a sinistra */
  //padding: 0.5vh;
  border-bottom: 2px solid white;
  width: 100vw;
  z-index: 1000;
}

/* Pulsanti circolari */
#centerButton, #sphereButton, #formButton {
  width: 3rem;
  height: 3rem;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  user-select: none;                 
  -webkit-tap-highlight-color: transparent;
}

#sphereButton img, #centerButton img, #formButton img {
  width: 70%;
  height: 70%;
  object-fit: contain;
  pointer-events: none;
}

#centerButton:active { background: yellow; }

/* Colori per Button */
.grey { background: #aaa; }
.yellow { background: #ffea00; }
.rosso { background: rgb(230, 75, 75); }
.blu   { background: rgb(100, 112, 235); } 

/* Slider */
#sliderContainer input[type="range"] {
  flex: 1;
  margin-left: 1vh;
  height: 2px;
  background: #eee;
  border-radius: 0.5vh;
  -webkit-appearance: none;
  margin: 0;
  padding: 0;
}

/* Thumb */
#sliderContainer input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 4vh;
  height: 4vh;
  background: #aaa;
  border-radius: 50%;
  cursor: pointer;
}
#sliderContainer input[type="range"]::-moz-range-thumb {
  width: 4vh;
  height: 4vh;
  background: #0078d7;
  border-radius: 50%;
  cursor: pointer;
}

/* --- STILI PER IL formBox E L'IMMAGINE --- */
/* Il box principale (posizionato via JS) */
#formBox {
  position: absolute;     /* già impostato via JS, ma qui per fallback */
  top: 7.5vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: none;          /* nascosto di default; JS lo mostra */
  max-width: 90vw;
  box-sizing: border-box;
  pointer-events: auto;
}

/* Immagine dentro formBox: default (PC) */
#formBox img {
  width: auto;    /* <- qui: PC = 60vw */
  max-width: 900px; /* opzionale: non crescerà oltre */
  height: 67.72vh;
  display: block;
}

/* Smartphone / schermi stretti */
@media (max-width: 768px) {
  #formBox img {
    width: 90vw;  /* <- qui: mobile = 85vw */
    height: auto;
    max-width: none;
  }
}
</style>
</head>

<body>
<div id="sliderContainer">
  <div id="sphereButton" class="grey"><img src="immagini/sfera.gif"></div>
  <div id="formButton" class="grey"><img src="immagini/formule.gif"></div>  
</div>


<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

let scene, camera, renderer;
let polyhedronGroup; // mantiene compatibilità col resto del codice
let isDragging = false, prevX = 0, prevY = 0;
const axisX = new THREE.Vector3(1,0,0);
const axisY = new THREE.Vector3(0,1,0);
const axisZ = new THREE.Vector3(0,0,1);

/* === creazione del formBox === */
const formBox = document.createElement("div");
formBox.id = "formBox";
formBox.innerHTML = `
  <div>
    <img src="immagini/dodecaedro.png">
  </div>
`;
document.body.appendChild(formBox);

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x64AFFF);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0,0,40);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // gruppo che ruota (come prima)
    polyhedronGroup = new THREE.Group();
    scene.add(polyhedronGroup);

    // -----------------------------
    // DODECAEDRO predefinito THREE
    // -----------------------------
    const geometry = new THREE.DodecahedronGeometry(10);
    const material = new THREE.MeshStandardMaterial({
        color: new THREE.Color(1,  0.1, 0.1),
        flatShading: true,
        side: THREE.DoubleSide,
        transparent: false,
        metalness: 0,       // non metallico
        roughness: 0.5 
    });
    const mesh = new THREE.Mesh(geometry, material);

    // contorni neri
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));

    // aggiungi entrambi al gruppo così la rotazione li muove insieme
    polyhedronGroup.add(mesh);
    polyhedronGroup.add(line);

    //Sfera Circoscritta
    // Crea la geometria della sfera trasparente con raggio 10
    const raggioSphere = 10 * 1.01;
    const sphereGeometry = new THREE.SphereGeometry(raggioSphere, 64, 64); // raggio 10
    const sphereMaterial = new THREE.MeshStandardMaterial({
    color:  new THREE.Color(1, 1, 1),   // giallo acceso
    transparent: true, 
    opacity: 0.3,      // trasparenza
    side: THREE.DoubleSide, // visibile dall'interno e dall'esterno
    metalness: 1,       // non metallico
    roughness: 0.55  
    });

    const transparentSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
    transparentSphere.visible = false;
    scene.add(transparentSphere);

    // luci
    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(50,50,50);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xbbbbbb));

    // eventi (mantengo i tuoi listener come prima)
    renderer.domElement.addEventListener('mousedown', e=>{ isDragging=true; prevX=e.clientX; prevY=e.clientY; });
    renderer.domElement.addEventListener('mouseup', ()=>{ isDragging=false; });
    renderer.domElement.addEventListener('mousemove', onMove);

    renderer.domElement.addEventListener('touchstart', e=>{ isDragging=true; prevX=e.touches[0].clientX; prevY=e.touches[0].clientY; });
    renderer.domElement.addEventListener('touchend', ()=>{ isDragging=false; });
    renderer.domElement.addEventListener('touchmove', e=>{
        if(!isDragging) return;
        const touch=e.touches[0];
        // usa la stessa logica che usavi prima con rotatePolyhedron? qui noi richiamiamo onMove-like
        // manteniamo coerenza: simula un evento mouse
        onMove({ clientX: touch.clientX, clientY: touch.clientY, touches: e.touches });
        prevX=touch.clientX; prevY=touch.clientY;
        e.preventDefault();
    },{passive:false});

    window.addEventListener('resize', ()=>{
        camera.aspect=window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth,window.innerHeight);
    });

const sphereButton = document.getElementById('sphereButton');

// stato iniziale
let sphereActive = false;
sphereButton.classList.add('grey1');

sphereButton.addEventListener('click', () => {
  if(!sphereActive){
	sphereButton.classList.remove('grey');
    	sphereButton.classList.add('yellow');
	transparentSphere.visible = true;    
        sphereActive = true;
  } else {
        sphereButton.classList.remove('yellow');
    	sphereButton.classList.add('grey');  
	transparentSphere.visible = false;
        sphereActive = false;
  }

  console.log("sphereButton cliccato, stato:", sphereActive);
});

const formButton = document.getElementById('formButton');
let formActive = false;

formButton.addEventListener('click', () => {
    formActive = !formActive;
    if(formActive){
        formButton.classList.remove('grey');
        formButton.classList.add('yellow');
        formBox.style.display = "block";
    } else {
        formButton.classList.remove('yellow');
        formButton.classList.add('grey');
        formBox.style.display = "none";
    }
});

}

// ScreenRadius: mantiene la tua logica (usa primo vertice del primo mesh)
function ScreenRadius() {
    return ((Math.asin(10 / camera.position.length())) / ((camera.fov * (Math.PI / 180)) / 2)) * (renderer.domElement.clientHeight / 2);
}

// onMove: ripristinata la tua logica (X/Y dentro il raggio, Z fuori)
function onMove(e){
    if(!isDragging) return;

    const centerX = renderer.domElement.clientWidth / 2;
    const centerY = renderer.domElement.clientHeight / 2;

    const v_prev = new THREE.Vector2(prevX - centerX, prevY - centerY);
    const v_curr = new THREE.Vector2(e.clientX - centerX, e.clientY - centerY);

    const dist = v_curr.length();
    const maxDist = ScreenRadius();

    if(dist <= maxDist){
        // rotazioni standard X/Y (esattamente come prima)
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        const qx = new THREE.Quaternion().setFromAxisAngle(axisX, dy * 0.01);
        const qy = new THREE.Quaternion().setFromAxisAngle(axisY, dx * 0.01);
        polyhedronGroup.quaternion.premultiply(qy);
        polyhedronGroup.quaternion.premultiply(qx);
    } else {
        // rotazione Z basata sull'angolo al centro (come volevi)
        const angle_prev = Math.atan2(v_prev.y, v_prev.x);
        const angle_curr = Math.atan2(v_curr.y, v_curr.x);
        let dangle = angle_prev - angle_curr;
        // normalizza per evitare salti grandi
        dangle = ((dangle + Math.PI) % (2*Math.PI)) - Math.PI;
        console.log("dangle (rad):", dangle, "≈ deg:", (dangle * 180 / Math.PI).toFixed(2));
        const qz = new THREE.Quaternion().setFromAxisAngle(axisZ, dangle);
        polyhedronGroup.quaternion.premultiply(qz);
    }

    prevX = e.clientX;
    prevY = e.clientY;
}

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}
</script>
</body>
</html>
